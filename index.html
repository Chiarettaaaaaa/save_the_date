<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Chiara & Alberto</title>

    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #2b3a32;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #e0e8e3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            background-image: radial-gradient(circle at center, #354a40 0%, #1e2c25 100%);
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #212f28;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            padding: 35px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        /* Angoli dorati decorativi */
        .corner {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--gold);
            border-style: solid;
        }
        .tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
        .tr { top: 10px; right: 10px; border-width: 1px 1px 0 0; }
        .bl { bottom: 10px; left: 10px; border-width: 0 0 1px 1px; }
        .br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

        .star {
            color: var(--gold);
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 15px;
        }

        .names {
            font-family: 'Alex Brush', cursive;
            font-size: 3.6rem;
            color: var(--gold-light);
            font-weight: normal;
            margin: 10px 0;
            line-height: 1.1;
        }

        .intro-text {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 25px;
            opacity: 0.9;
        }

        /* RIQUADRO GRATTAMI (SCRATCH BOX) */
        .scratch-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 110px;
            margin: 0 auto 25px auto;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            user-select: none;
            -webkit-user-select: none;
        }

        /* Testo nascosto sotto la patina */
        .scratch-secret {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #19241f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .scratch-date {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--gold-light);
            font-weight: 600;
        }

        .scratch-location {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* Canvas da grattare via */
        .scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
            touch-action: none;
        }

        /* COUNTDOWN TIMER */
        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 25px 0;
        }

        .timer-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 6px;
            padding: 8px 6px;
            min-width: 65px;
        }

        .timer-num {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold-light);
            display: block;
        }

        .timer-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(224, 232, 227, 0.7);
        }

        /* BOTTONE SALVA NEL CALENDARIO */
        .btn-calendar {
            display: inline-block;
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 12px 24px;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            background: transparent;
        }

        .btn-calendar:hover {
            background: var(--gold);
            color: #1e2c25;
        }

        /* BOTTONE AUDIO */
        .audio-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #212f28;
            border: 1px solid var(--gold);
            color: var(--gold-light);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 99;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <audio id="bgAudio" loop preload="auto">
        <source src="background.mpeg" type="audio/mpeg">
    </audio>

    <button class="audio-btn" id="musicToggle" title="Musica">🎵</button>

    <div class="card">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="star">✧</div>
        <div class="subtitle">Save the Date</div>

        <h1 class="names">Chiara &amp; Alberto</h1>

        <p class="intro-text">Scopri i dettagli del nostro matrimonio</p>

        <!-- RIQUADRO GRATTAMI -->
        <div class="scratch-container" id="scratchContainer">
            <div class="scratch-secret">
                <div class="scratch-date">✧ 02 . 10 . 2027 ✧</div>
                <div class="scratch-location">Parrocchia Regina Pacis</div>
            </div>
            <canvas id="scratchCanvas" class="scratch-canvas"></canvas>
        </div>

        <!-- COUNTDOWN -->
        <div class="timer-grid">
            <div class="timer-box">
                <span class="timer-num" id="days">00</span>
                <span class="timer-label">Giorni</span>
            </div>
            <div class="timer-box">
                <span class="timer-num" id="hours">00</span>
                <span class="timer-label">Ore</span>
            </div>
            <div class="timer-box">
                <span class="timer-num" id="minutes">00</span>
                <span class="timer-label">Minuti</span>
            </div>
            <div class="timer-box">
                <span class="timer-num" id="seconds">00</span>
                <span class="timer-label">Secondi</span>
            </div>
        </div>

        <!-- SALVA NEL CALENDARIO -->
        <a href="data:text/calendar;charset=utf8,BEGIN:VCALENDAR%0AVERSION:2.0%0ABEGIN:VEVENT%0ASUMMARY:Matrimonio%20Chiara%20%26%20Alberto%0ADESCRIPTION:Matrimonio%20di%20Chiara%20e%20Alberto%20presso%20Parrocchia%20Regina%20Pacis%0ALOCATION:Parrocchia%20Regina%20Pacis%0ADTSTART:20271002T110000Z%0ADTEND:20271002T230000Z%0AEND:VEVENT%0AEND:VCALENDAR" download="Chiara_Alberto_SaveTheDate.ics" class="btn-calendar">
            Salva nel Calendario
        </a>

        <div class="star" style="margin-top: 25px;">✧</div>
    </div>

    <script>
        // 1. LOGICA SCRATCH (GRATTAMI VIA CANVAS)
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('scratchContainer');

        function initScratch() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            // Patina dorata
            ctx.fillStyle = '#c5a059';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sfumatura metallica
            let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(255,255,255,0.2)');
            grad.addColorStop(0.5, 'rgba(0,0,0,0.1)');
            grad.addColorStop(1, 'rgba(255,255,255,0.2)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Testo guida
            ctx.font = 'bold 16px "Cinzel", serif';
            ctx.fillStyle = '#212f28';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✨ GRATTAMI ✨', canvas.width / 2, canvas.height / 2);
        }

        let isDrawing = false;

        function scratch(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            let x, y;

            if (e.touches && e.touches[0]) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2, false);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });

        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);

        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchmove', scratch);

        window.addEventListener('load', initScratch);

        // 2. LOGICA COUNTDOWN (Target: 02 Ottobre 2027, 11:00 AM)
        const targetDate = new Date("2027-10-02T11:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days.toString().padStart(2, '0');
                document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
                document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // 3. AUDIO BACKGROUND
        const audio = document.getElementById('bgAudio');
        const musicBtn = document.getElementById('musicToggle');
        let playing = false;

        musicBtn.addEventListener('click', () => {
            if (!playing) {
                audio.play().then(() => {
                    playing = true;
                    musicBtn.innerText = '🔊';
                }).catch(() => {
                    alert("Assicurati che il file 'background.mpeg' sia presente nella stessa cartella del file HTML!");
                });
            } else {
                audio.pause();
                playing = false;
                musicBtn.innerText = '🎵';
            }
        });
    </script>
</body>
</html>
